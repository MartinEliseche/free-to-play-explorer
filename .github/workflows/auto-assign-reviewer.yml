name: Auto Assign Reviewer

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign-reviewer:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prAuthor = context.payload.pull_request.user.login;

            // Obtenemos la lista de colaboradores del repositorio
            const { data: collaborators } = await github.rest.repos.listCollaborators({
              owner,
              repo,
            });

            // Mapeamos los logins y filtramos
            const candidates = collaborators
              .map(m => m.login)
              // .filter(login => login !== prAuthor); // Comentado para que te asigne a vos mismo en la prueba

            if (candidates.length === 0) {
              console.log('No hay revisores disponibles.');
              return;
            }

            // Elegir uno al azar
            const reviewer = candidates[Math.floor(Math.random() * candidates.length)];
            console.log(`Asignando revisor: ${reviewer}`);

            await github.rest.pulls.requestReviewers({
              owner: owner,
              repo: repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [reviewer],
            });